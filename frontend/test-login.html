<!DOCTYPE html>
<html>
<head>
    <title>Test Login API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { padding: 8px; width: 280px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        #result { margin-top: 20px; font-weight: bold; }
        #token-box { margin-top: 10px; padding: 10px; background: #f0f0f0; word-break: break-all; font-family: monospace; font-size: 12px; display: none; }
    </style>
</head>
<body>

    <h2>🔐 Test Login API (Phase 4)</h2>
    <p>Use the same email/password you registered with in Phase 3.</p>
    
    <div class="form-group">
        <label>Email:</label><br>
        <input type="text" id="email" placeholder="raj@example.com">
    </div>
    
    <div class="form-group">
        <label>Password:</label><br>
        <input type="password" id="password" placeholder="Enter your password">
    </div>
    
    <button onclick="testLogin()">Login</button>

    <div id="result"></div>
    <div id="token-box"></div>

    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const resultDiv = document.getElementById('result');
            const tokenBox = document.getElementById('token-box');

            resultDiv.style.color = 'black';
            resultDiv.innerText = 'Logging in...';
            tokenBox.style.display = 'none';

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save token to localStorage (will be used later)
                    localStorage.setItem('token', data.token);

                    resultDiv.style.color = 'green';
                    resultDiv.innerText = '✅ SUCCESS: ' + data.message;

                    tokenBox.style.display = 'block';
                    tokenBox.innerHTML = '<b>Your JWT Token (saved in localStorage):</b><br><br>' + data.token;
                } else {
                    resultDiv.style.color = 'red';
                    resultDiv.innerText = '❌ ERROR: ' + data.error;
                }
            } catch (error) {
                resultDiv.style.color = 'red';
                resultDiv.innerText = '❌ CONNECTION FAILED! Make sure backend server is running.';
            }
        }
    </script>
</body>
</html>
