<!DOCTYPE html>
<html>
<head>
    <title>Test Registration API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { padding: 8px; width: 250px; }
        button { padding: 10px 15px; background: blue; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; color: green; }
    </style>
</head>
<body>

    <h2>Test Register API (Phase 3)</h2>
    
    <div class="form-group">
        <label>Name: </label><br>
        <input type="text" id="name" placeholder="Enter Name">
    </div>
    
    <div class="form-group">
        <label>Email: </label><br>
        <input type="text" id="email" placeholder="Enter Email">
    </div>
    
    <div class="form-group">
        <label>Password: </label><br>
        <input type="password" id="password" placeholder="Enter Password">
    </div>
    
    <button onclick="testRegister()">Register User</button>

    <div id="result"></div>

    <script>
        async function testRegister() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.color = 'black';
            resultDiv.innerText = 'Sending data to backend...';

            try {
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                
                if(response.ok) {
                    resultDiv.style.color = 'green';
                    resultDiv.innerText = "SUCCESS: " + JSON.stringify(data);
                } else {
                    resultDiv.style.color = 'red';
                    resultDiv.innerText = "ERROR: " + JSON.stringify(data);
                }
            } catch (error) {
                resultDiv.style.color = 'red';
                resultDiv.innerText = "CONNECTION FAILED! Make sure backend server is running.";
            }
        }
    </script>
</body>
</html>
